name: Petlibro Backfill

# Recovers historical daily totals the live sync never captured. The sync only
# ever writes today and yesterday, so any outage longer than two days leaves a
# hole — and Petlibro discards history older than ~170 days, after which that
# hole is permanent. The weekly run heals gaps well inside that window.
#
# Runs here rather than from a laptop so CRON_SECRET stays in GitHub secrets and
# never has to be copied around.
#
# Covers every site that runs this codebase, one per fountain, the same way as
# sync.yml: site1 uses the original secret names, site2 its SITE2_ ones (see
# docs/second-site.md). The weekly run does every site that is set up; a manual
# run can pick one.
#
# See docs/petlibro-history-api.md for the retention findings.
on:
  schedule:
    # Weekly, Sunday 06:17 UTC. Off the hour to dodge GitHub's queue spike.
    # A gap is healed within a week, against a window that is ~24 weeks wide.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      site:
        description: "Which site to backfill"
        type: choice
        options:
          - all
          - site1
          - site2
        required: true
        default: all
      months:
        description: "How many months back to walk (1-24)"
        required: true
        default: "6"
      dry_run:
        description: "Report what would be written, without writing"
        type: boolean
        required: true
        default: true
      overwrite:
        description: "Replace existing rows (default fills only missing days)"
        type: boolean
        required: true
        default: false
      hourly_days:
        description: "Also repair N days of hourly buckets (0 = skip, max 60)"
        required: false
        default: "0"

jobs:
  backfill:
    name: backfill (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One site failing must not cancel the other's backfill.
      fail-fast: false
      # One site at a time, for the same shared-login reason as sync.yml.
      max-parallel: 1
      matrix:
        include:
          - site: site1
            url_secret: RENDER_APP_URL
            cron_secret: CRON_SECRET
          - site: site2
            url_secret: SITE2_RENDER_APP_URL
            cron_secret: SITE2_CRON_SECRET
    env:
      APP_URL: ${{ secrets[matrix.url_secret] }}
      CRON_SECRET: ${{ secrets[matrix.cron_secret] }}
    steps:
      - name: Check the site is selected and set up
        id: site
        env:
          # Empty on a schedule run, which covers every site that is set up.
          IN_SITE: ${{ inputs.site }}
        run: |
          if [ -n "$IN_SITE" ] && [ "$IN_SITE" != "all" ] && [ "$IN_SITE" != "${{ matrix.site }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not selected for this run (site: $IN_SITE)."
          elif [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$IN_SITE" = "${{ matrix.site }}" ]; then
            # Asked for by name, so a missing secret is an error, not a skip.
            echo "::error::${{ matrix.site }} is not set up: add the ${{ matrix.url_secret }} and ${{ matrix.cron_secret }} repository secrets."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.site }}: add the ${{ matrix.url_secret }} and ${{ matrix.cron_secret }} repository secrets to backfill it."
          fi

      - name: Wake Render instance
        if: steps.site.outputs.ready == 'true'
        run: |
          echo "Pinging health endpoint to wake the instance..."
          curl -sf --max-time 60 "$APP_URL/api/health" \
            || echo "Wake ping sent (instance may be cold-starting)"

      - name: Wait for cold start
        if: steps.site.outputs.ready == 'true'
        run: sleep 45

      - name: Verify instance is awake
        if: steps.site.outputs.ready == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$APP_URL/api/health")
          if [ "$STATUS" = "200" ]; then
            echo "Instance is awake."
          else
            echo "Health check returned $STATUS — proceeding anyway."
          fi

      - name: Run backfill
        id: backfill
        if: steps.site.outputs.ready == 'true'
        env:
          # Empty on a schedule run: the inputs context only exists for
          # workflow_dispatch. Defaulting happens in shell below, where it can
          # be unit-tested, rather than in a GitHub expression, which cannot.
          IN_MONTHS: ${{ inputs.months }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_OVERWRITE: ${{ inputs.overwrite }}
          IN_HOURLY_DAYS: ${{ inputs.hourly_days }}
        run: |
          # Scheduled defaults: walk two months, actually write, never clobber.
          # Two months comfortably covers any plausible sync outage while
          # keeping the run to about three API calls.
          MONTHS="${IN_MONTHS:-2}"
          DRY_RUN="${IN_DRY_RUN:-false}"
          OVERWRITE="${IN_OVERWRITE:-false}"
          # Off by default, including on the schedule: the sync now keeps
          # hourly buckets current, so this is only for a one-off repair.
          HOURLY_DAYS="${IN_HOURLY_DAYS:-0}"

          QS="months=$MONTHS"
          [ "$DRY_RUN" = "true" ]   && QS="$QS&dryRun=true"
          [ "$OVERWRITE" = "true" ] && QS="$QS&overwrite=true"
          [ "$HOURLY_DAYS" != "0" ] && QS="$QS&hourlyDays=$HOURLY_DAYS"

          echo "Site: ${{ matrix.site }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Requesting /api/backfill?$QS"

          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/backfill?$QS")

          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $STATUS"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          # Surface the result on the run's summary page, not just in the log.
          {
            echo "### Backfill result: ${{ matrix.site }}"
            echo ""
            echo "Trigger \`${{ github.event_name }}\` · \`months=$MONTHS\` · \`dryRun=$DRY_RUN\` · \`overwrite=$OVERWRITE\` · \`hourlyDays=$HOURLY_DAYS\`"
            echo ""
            echo "HTTP \`$STATUS\`"
            echo ""
            echo '```json'
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$STATUS" = "200" ]

      - name: Reminder when this was only a dry run
        if: success() && inputs.dry_run && steps.site.outputs.ready == 'true'
        run: |
          echo "::notice::Dry run only — nothing was written. Re-run with dry_run unchecked to commit."
