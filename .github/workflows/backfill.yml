name: Petlibro Backfill

# Recovers historical daily totals the live sync never captured. The sync only
# ever writes today and yesterday, so any outage longer than two days leaves a
# hole — and Petlibro discards history older than ~170 days, after which that
# hole is permanent. The weekly run heals gaps well inside that window.
#
# Runs here rather than from a laptop so CRON_SECRET stays in GitHub secrets and
# never has to be copied around.
#
# See docs/petlibro-history-api.md for the retention findings.
on:
  schedule:
    # Weekly, Sunday 06:17 UTC. Off the hour to dodge GitHub's queue spike.
    # A gap is healed within a week, against a window that is ~24 weeks wide.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      months:
        description: "How many months back to walk (1-24)"
        required: true
        default: "6"
      dry_run:
        description: "Report what would be written, without writing"
        type: boolean
        required: true
        default: true
      overwrite:
        description: "Replace existing rows (default fills only missing days)"
        type: boolean
        required: true
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake Render instance
        run: |
          echo "Pinging health endpoint to wake the instance..."
          curl -sf --max-time 60 "${{ secrets.RENDER_APP_URL }}/api/health" \
            || echo "Wake ping sent (instance may be cold-starting)"

      - name: Wait for cold start
        run: sleep 45

      - name: Verify instance is awake
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "${{ secrets.RENDER_APP_URL }}/api/health")
          if [ "$STATUS" = "200" ]; then
            echo "Instance is awake."
          else
            echo "Health check returned $STATUS — proceeding anyway."
          fi

      - name: Run backfill
        id: backfill
        env:
          # Empty on a schedule run: the inputs context only exists for
          # workflow_dispatch. Defaulting happens in shell below, where it can
          # be unit-tested, rather than in a GitHub expression, which cannot.
          IN_MONTHS: ${{ inputs.months }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_OVERWRITE: ${{ inputs.overwrite }}
        run: |
          # Scheduled defaults: walk two months, actually write, never clobber.
          # Two months comfortably covers any plausible sync outage while
          # keeping the run to about three API calls.
          MONTHS="${IN_MONTHS:-2}"
          DRY_RUN="${IN_DRY_RUN:-false}"
          OVERWRITE="${IN_OVERWRITE:-false}"

          QS="months=$MONTHS"
          [ "$DRY_RUN" = "true" ]   && QS="$QS&dryRun=true"
          [ "$OVERWRITE" = "true" ] && QS="$QS&overwrite=true"

          echo "Trigger: ${{ github.event_name }}"
          echo "Requesting /api/backfill?$QS"

          RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.RENDER_APP_URL }}/api/backfill?$QS")

          STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP $STATUS"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          # Surface the result on the run's summary page, not just in the log.
          {
            echo "### Backfill result"
            echo ""
            echo "Trigger \`${{ github.event_name }}\` · \`months=$MONTHS\` · \`dryRun=$DRY_RUN\` · \`overwrite=$OVERWRITE\`"
            echo ""
            echo "HTTP \`$STATUS\`"
            echo ""
            echo '```json'
            echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$STATUS" = "200" ]

      - name: Reminder when this was only a dry run
        if: success() && inputs.dry_run
        run: |
          echo "::notice::Dry run only — nothing was written. Re-run with dry_run unchecked to commit."
